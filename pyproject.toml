[project]
name = "numa-inbox-zero"
version = "0.1.0"
description = "Gmail の受信トレイの未処理メールを Jev で分類してアーカイブ / スターを付ける個人用ツール"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
numa-inbox-zero = "numa_inbox_zero.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numa_inbox_zero"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
